mainprefix = "z"                # Ideally, replace "z" across the whole repo with your mod's mainprefix, example "t" (without the "")
prefix = "cvo_ammo_logistics"   # Ideally, replace "~PREFIX~" across the whole repo with your mod's prefix, example "mod" (without the "") 
# thats a clumsy prefix imho. sth short like "cal" or "redmag" or something like this is better. its very worth while to avoid underscore's within the prefix itself

name = "24th CVO Ammo Logistics"

[properties]
author = "24th Chorni Voron"
url = "https://github.com/SkippieDippie/CVO-Ammo-Logistics"

[binarize]
# enabled = true # Default: true

[files]
include = [
    "mod.cpp",      # These files are copied to the build directory by default
    "meta.cpp",     # They do not need to be added to your list
    "LICENSE",
    "/img/*.paa",
    "logo_ca.paa",
    "logo_co.paa",
    "*.bikey",
]
exclude = [
    "*.psd",        # By default this list is empty
    "*.md",
    "/.vscode/",
]

[version]
# path = "addons/main/script_version.hpp" # Default
# major = 0 # Overrides path when set
# minor = 1
# patch = 1
git_hash = 0 # Default: 8
